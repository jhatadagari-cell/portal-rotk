<script>
  /* El 404 puede servirse en CUALQUIER ruta inexistente y bajo subruta de proyecto
     (GitHub Pages: /portal-rotk/…). Fijamos <base> a la RAÍZ del sitio para que TODO
     lo relativo (estilos, chrome.js, botones) resuelva bien, sin importar la
     profundidad de la URL rota. Antes se usaban rutas '/…' absolutas → apuntaban al
     dominio raíz y "Volver al portal" no volvía. En dominio propio en la raíz, base='/'. */
  (function () {
    var parts = location.pathname.split('/').filter(Boolean);
    var base = '/';
    if (/\.github\.io$/i.test(location.hostname) && parts.length) base = '/' + parts[0] + '/';
    var b = document.createElement('base');
    b.href = location.origin + base;
    document.head.appendChild(b);
  })();
</script>
