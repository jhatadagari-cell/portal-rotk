<!DOCTYPE html>
<html lang="es" data-page-section="acceder">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceder · Portal ROTK</title>
<meta name="description" content="Accede o regístrate en el Portal ROTK.">
<meta name="robots" content="noindex">

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English:ital@0;1&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/chrome.css?v=4">
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>

<div id="chrome-nav"></div>

<main class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <span class="auth-zh">入</span>
      <h1 class="auth-ttl">Entrar al Portal</h1>
      <p class="auth-sub">Accede a tu cuenta o crea una nueva.</p>
    </div>

    <button class="auth-google" id="btn-google" type="button">
      <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
      Entrar con Google
    </button>

    <div class="auth-or"><span>o con tu correo</span></div>

    <div class="auth-tabs" role="tablist">
      <button class="auth-tab on" data-tab="login" role="tab">Acceder</button>
      <button class="auth-tab" data-tab="register" role="tab">Registrarse</button>
    </div>

    <!-- ── Acceder ── -->
    <form class="auth-form on" id="form-login" autocomplete="on">
      <label class="auth-field">
        <span>Correo</span>
        <input type="email" name="email" required autocomplete="email" placeholder="tu@correo.com">
      </label>
      <label class="auth-field">
        <span>Contraseña</span>
        <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </label>
      <p class="auth-msg" id="login-msg"></p>
      <button type="submit" class="auth-btn">Acceder</button>
    </form>

    <!-- ── Registrarse ── -->
    <form class="auth-form" id="form-register" autocomplete="on">
      <label class="auth-field">
        <span>Nombre</span>
        <input type="text" name="nombre" required autocomplete="name" placeholder="Cómo quieres que te llamen">
      </label>
      <label class="auth-field">
        <span>Correo</span>
        <input type="email" name="email" required autocomplete="email" placeholder="tu@correo.com">
      </label>
      <label class="auth-field">
        <span>Contraseña</span>
        <input type="password" name="password" required autocomplete="new-password" placeholder="Mínimo 6 caracteres">
      </label>
      <p class="auth-msg" id="register-msg"></p>
      <button type="submit" class="auth-btn">Crear cuenta</button>
    </form>

    <p class="auth-note">Prototipo: tu cuenta se guarda solo en este navegador. No uses una contraseña real.</p>
  </div>
</main>

<div id="chrome-footer"></div>

<script src="assets/js/auth.js"></script>
<script>
(async function () {
  'use strict';

  // Supabase es asíncrono: esperamos a que cargue la sesión inicial.
  await Auth.ready();

  // ── Si ya hay sesión, fuera de aquí ──
  const ya = Auth.current();
  if (ya) { location.href = ya.role === 'admin' ? 'admin-haciendas.html' : 'index.html'; return; }

  // ── Entrar con Google ──
  const gbtn = document.getElementById('btn-google');
  if (gbtn) gbtn.addEventListener('click', async () => {
    const msg = document.getElementById('login-msg');
    setMsg(msg, 'Redirigiendo a Google…', true);
    try {
      // Volvemos a esta misma página; el guard de arriba redirige según el rol.
      await Auth.loginWithGoogle(location.origin + location.pathname);
    } catch (err) { setMsg(msg, err.message, false); }
  });

  // ── Pestañas ──
  const tabs  = document.querySelectorAll('.auth-tab');
  const forms = { login: document.getElementById('form-login'), register: document.getElementById('form-register') };
  tabs.forEach(t => t.addEventListener('click', () => {
    tabs.forEach(x => x.classList.toggle('on', x === t));
    const which = t.dataset.tab;
    Object.entries(forms).forEach(([k, f]) => f.classList.toggle('on', k === which));
  }));

  const redirect = (user) => {
    location.href = user.role === 'admin' ? 'admin-haciendas.html' : 'index.html';
  };
  const setMsg = (el, txt, ok) => {
    el.textContent = txt;
    el.classList.toggle('err', !ok);
    el.classList.toggle('ok', !!ok);
  };

  // ── Acceder ──
  forms.login.addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    const msg = document.getElementById('login-msg');
    setMsg(msg, '', true);
    try {
      const user = await Auth.login({ email: f.email.value, password: f.password.value });
      setMsg(msg, 'Bienvenido. Entrando…', true);
      redirect(user);
    } catch (err) { setMsg(msg, err.message, false); }
  });

  // ── Registrarse ──
  forms.register.addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    const msg = document.getElementById('register-msg');
    setMsg(msg, '', true);
    try {
      const { user, needsConfirm } = await Auth.register({ nombre: f.nombre.value, email: f.email.value, password: f.password.value });
      if (needsConfirm || !user) {
        setMsg(msg, 'Cuenta creada. Revisa tu correo para confirmarla y luego entra.', true);
        return;
      }
      setMsg(msg, 'Cuenta creada. Entrando…', true);
      redirect(user);
    } catch (err) { setMsg(msg, err.message, false); }
  });
})();
</script>
<script src="assets/js/chrome.js"></script>
</body>
</html>
