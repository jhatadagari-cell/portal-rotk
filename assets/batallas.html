<link rel="stylesheet" href="css/battle.css">
<style>
  .page-hero{padding:48px 0 36px;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:40px}
  .page-eyebrow{font-family:'Cinzel Decorative',serif;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);opacity:.7;margin-bottom:14px}
  .page-title{font-family:'Noto Serif SC',serif;font-size:clamp(32px,5vw,52px);color:var(--text);margin:0 0 12px;line-height:1.1}
  .page-desc{font-family:'IM Fell English',serif;font-style:italic;font-size:19px;line-height:1.8;color:var(--muted);max-width:640px;margin:0}
  .battles-timeline{display:flex;flex-direction:column;gap:20px}
  .btcard{display:grid;grid-template-columns:90px 1fr;gap:0;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;transition:border-color .22s,background .22s;position:relative}
  .btcard::before{content:'';position:absolute;top:0;left:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--gold),rgba(201,168,76,.1));opacity:.4}
  .btcard:not(.btcard--soon):hover{background:rgba(255,255,255,.05);border-color:rgba(201,168,76,.3)}
  .btcard--soon{opacity:.5}
  .btcard-year{padding:22px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-right:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02)}
  .btcard-year-num{font-family:'Cinzel Decorative',serif;font-size:13px;letter-spacing:.1em;color:var(--gold);text-align:center;line-height:1.3}
  .btcard-year-era{font-family:'Cinzel Decorative',serif;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);opacity:.6;text-align:center;line-height:1.4}
  .btcard-body{padding:20px 24px}
  .btcard-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
  .btcard-zh{font-family:'Noto Serif SC',serif;font-size:22px;color:var(--text)}
  .btcard-result{display:inline-flex;font-family:'Cinzel Decorative',serif;font-size:9px;letter-spacing:.15em;text-transform:uppercase;padding:3px 10px;border-radius:2px;border:1px solid;flex-shrink:0}
  .btcard-result.victoria{color:#7dba80;border-color:#7dba80;background:rgba(125,186,128,.08)}
  .btcard-result.pirrica{color:var(--gold);border-color:var(--gold);background:rgba(201,168,76,.07)}
  .btcard-result.soon{color:var(--muted);border-color:rgba(255,255,255,.2);opacity:.5}
  .btcard-en{font-family:'Cinzel Decorative',serif;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);opacity:.6;margin-bottom:10px}
  .btcard-matchup{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .btcard-bando{font-family:'Cinzel Decorative',serif;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:3px 10px;border-radius:2px;border:1px solid;white-space:nowrap}
  .btcard-bando--win{color:#7dba80;border-color:rgba(125,186,128,.35);background:rgba(125,186,128,.07)}
  .btcard-bando--lose{color:var(--muted);border-color:rgba(255,255,255,.1);background:rgba(255,255,255,.02);opacity:.65}
  .btcard-bando--draw{color:var(--gold);border-color:rgba(201,168,76,.3);background:rgba(201,168,76,.06)}
  .btcard-matchup-sep{font-family:'Noto Serif SC',serif;font-size:11px;color:var(--muted);opacity:.35;flex-shrink:0}
  .btcard-desc{font-family:'IM Fell English',serif;font-size:16px;line-height:1.8;color:var(--muted);margin:0 0 14px}
  .btcard-link{font-family:'Cinzel Decorative',serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);opacity:.8;display:inline-flex;align-items:center;gap:5px}
  .btcard-link:hover{opacity:1}
  @media(max-width:640px){.btcard{grid-template-columns:1fr} .btcard-year{flex-direction:row;justify-content:flex-start;border-right:none;border-bottom:1px solid rgba(255,255,255,.06);padding:12px 20px}}
</style>
</head>
<body>

<div id="chrome-nav"></div>

<main class="wrap">

  <div class="page-hero">
    <div class="page-eyebrow">Batallas</div>
    <h1 class="page-title">Los Grandes Enfrentamientos</h1>
    <p class="page-desc">Las batallas que definieron el destino de China entre los siglos II y III. Desde la rebelión que resquebrajó la Han hasta el fuego que hizo inevitables los Tres Reinos.</p>
  </div>

  <div class="battles-timeline" id="battles-list"></div>

</main>

<script src="js/data.js"></script>
<script>
(function () {
  const BADGE = { victoria: 'Victoria', pirrica: 'Victoria Pírrica', indecisa: 'Indecisa' };
  const list = document.getElementById('battles-list');

  BATTLES.filter(b => b.v1).forEach(b => {
    const soon = !b.detailHref;
    const isPirrica = b.result === 'pirrica';
    const badgeClass = soon ? 'soon' : (b.result || 'victoria');
    const badgeText = soon ? 'Próximamente' : (BADGE[b.result] || 'Victoria');

    const matchupHtml = (!soon && b.ganador) ? `
      <div class="btcard-matchup">
        <span class="btcard-bando btcard-bando--${isPirrica ? 'draw' : 'win'}">${b.ganador}</span>
        <span class="btcard-matchup-sep">对</span>
        <span class="btcard-bando btcard-bando--${isPirrica ? 'draw' : 'lose'}">${b.perdedor}</span>
      </div>` : '';

    const card = document.createElement('div');
    card.className = soon ? 'btcard btcard--soon' : 'btcard';
    card.innerHTML = `
      <div class="btcard-year">
        <span class="btcard-year-num">${b.yearLabel}</span>
        <span class="btcard-year-era">${b.era}</span>
      </div>
      <div class="btcard-body">
        <div class="btcard-top">
          <span class="btcard-zh">${b.zh}</span>
          <span class="btcard-result ${badgeClass}">${badgeText}</span>
        </div>
        <div class="btcard-en">${b.en}</div>
        ${matchupHtml}
        <p class="btcard-desc">${b.desc}</p>
        ${!soon ? `<a class="btcard-link" href="${b.detailHref.replace('assets/', '')}">Ver batalla →</a>` : ''}
      </div>
    `;
    list.appendChild(card);
  });
})();
</script>

<div id="chrome-footer"></div>
<script src="../assets/js/chrome.js"></script>
</body>
</html>
