// Cada Zhou tiene: path SVG real + centroide + ciudades + desc
// ViewBox del mapa base: 0 0 800 750
// Calibración: aproximadamente
//   x: 73°E=20px, 135°E=780px → 1°lon = (780-20)/62 = 12.26px
//   y: 53°N=20px, 18°N=730px  → 1°lat = (730-20)/35 = 20.29px
// lon→x: (lon-73)*12.26 + 20
// lat→y: (53-lat)*20.29 + 20

function lx(lon){ return ((lon-73)*12.26+20).toFixed(1) }
function ly(lat){ return ((53-lat)*20.29+20).toFixed(1) }
function lxy(lon,lat){ return lx(lon)+','+ly(lat) }

// ══════════════════════════════════════════════════════════════
//  ESTADO Y RENDER
// ══════════════════════════════════════════════════════════════
let P=null, level=0, selZ=null;
let showN=true,showC=true,showPP=true;

const VW=800, VH=750;

function buildSVG(){
  const rf=P?RF[P.id]:{};
  const focusZ = level===1 ? ZHOU.find(z=>z.id===selZ) : null;

  // ViewBox: zoom a zhou o mapa completo
  let vx=0,vy=0,vw=VW,vh=VH;
  if(focusZ){
    // Bbox de la zhou seleccionada con margen
    const coords=[];
    focusZ.path.replace(/[\d.]+,[\d.]+/g,m=>{coords.push(m.split(',').map(Number));});
    if(coords.length){
      const xs=coords.map(c=>c[0]), ys=coords.map(c=>c[1]);
      const margin=60;
      vx=Math.max(0,Math.min(...xs)-margin);
      vy=Math.max(0,Math.min(...ys)-margin);
      vw=Math.min(VW,Math.max(...xs)+margin)-vx;
      vh=Math.min(VH,Math.max(...ys)+margin)-vy;
    }
  }

  let s=`<svg viewBox="${vx} ${vy} ${vw} ${vh}" xmlns="http://www.w3.org/2000/svg"
    preserveAspectRatio="xMidYMid meet"
    style="width:100%;height:100%;display:block;max-height:calc(100vh - 162px)">
  <defs>
    <filter id="gl"><feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="5"
      flood-color="#000" flood-opacity="0.6"/></filter>
    <filter id="gll"><feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    <!-- PATRÓN MAR — olas sutiles -->
    <pattern id="sea-wave" x="0" y="0" width="24" height="10" patternUnits="userSpaceOnUse">
      <path d="M0,5 Q6,2 12,5 Q18,8 24,5" fill="none" stroke="rgba(80,150,220,.18)" stroke-width="0.9"/>
    </pattern>
    <!-- PATRÓN TIERRA — textura pergamino -->
    <pattern id="land-tex" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <circle cx="2" cy="2" r="0.4" fill="rgba(100,60,10,.12)"/>
    </pattern>

    <!-- Gradiente tierra base -->
    <radialGradient id="land-g" cx="40%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#d8b878"/>
      <stop offset="50%" stop-color="#c49a50"/>
      <stop offset="100%" stop-color="#a07830"/>
    </radialGradient>
    <!-- Gradiente mar -->
    <linearGradient id="sea-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#0d2030"/>
    </linearGradient>
    <!-- Ríos -->
    <linearGradient id="riv-g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5090c8" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#3a6fa8" stop-opacity=".7"/>
    </linearGradient>
  </defs>

  <!-- ══ FONDO MAR ══ -->
  <rect width="${VW}" height="${VH}" fill="url(#sea-g)"/>
  <rect width="${VW}" height="${VH}" fill="url(#sea-wave)"/>`;

  // Etiquetas mar (solo en nivel 0)
  if(!focusZ){
    s+=`
  <text x="720" y="380" text-anchor="middle" font-family="IM Fell English"
    font-style="italic" font-size="16" fill="rgba(100,160,220,.25)"
    transform="rotate(-8,720,380)">東 海</text>
  <text x="650" y="690" text-anchor="middle" font-family="IM Fell English"
    font-style="italic" font-size="14" fill="rgba(100,160,220,.2)">南 海</text>
  <text x="75" y="180" text-anchor="middle" font-family="IM Fell English"
    font-style="italic" font-size="12" fill="rgba(100,160,220,.15)">西 域</text>`;
  }

  // ══ TIERRA BASE ══
  s+=`\n  <path d="${OUTER}" fill="url(#land-g)" stroke="#8a6020" stroke-width="1.8"
    filter="url(#sh)"/>
  <path d="${OUTER}" fill="url(#land-tex)"/>`;

  // ══ ZHOU COLOREADAS ══
  s+=`\n  <g id="g-zhou">`;
  ZHOU.forEach(z=>{
    const fk=rf[z.id]||'neut';
    const f=FAC[fk]||FAC.neut;
    const isSelected=focusZ&&focusZ.id===z.id;
    const dimmed=focusZ&&!isSelected;
    const op=dimmed?0.3:0.92;
    s+=`\n    <path id="zp_${z.id}"
      d="${z.path}"
      fill="${f.fill}" stroke="${isSelected?f.c:'rgba(60,40,10,.5)'}"
      stroke-width="${isSelected?2.2:0.9}" opacity="${op}"
      ${focusZ?'':`class="zreg-hit" style="cursor:pointer"` }
      ${!focusZ?`onclick="clickZ('${z.id}')" ` :''}
      ${isSelected?'filter="url(#gll)"':''}
    />`;
  });
  s+=`\n  </g>`;

  // ══ RÍOS ══
  // Huang He — polilínea con los puntos reales
  const hhPts=[[96,36],[98,36],[100,36],[102,36],[103,37],[104,37],[104,38],[103,38],
    [105,38],[106,40],[107,40],[108,40],[109,40],[110,40],[111,40],[111,39],
    [111,38],[110,37],[110,36],[111,35],[112,35],[113,35],[114,35],[115,35],
    [116,35],[117,36],[118,36],[119,36],[120,37],[121,37]];
  const yyPts=[[98,30],[100,28],[101,28],[102,28],[103,28],[104,29],[105,29],
    [106,29],[107,29],[108,30],[109,30],[110,30],[111,29],[112,30],[113,30],
    [114,30],[115,30],[116,30],[117,30],[118,31],[119,31],[120,32],[121,31]];
  const weiPts=[[104,34],[106,34],[108,34],[109,34],[110,34]];
  const hanPts=[[107,33],[108,32],[109,32],[110,31],[111,31],[112,30]];

  function rPts(arr){return arr.map(([lo,la])=>`${lx(lo)},${ly(la)}`).join(' ')}

  s+=`
  <!-- RÍO AMARILLO -->
  <polyline id="hh" points="${rPts(hhPts)}"
    fill="none" stroke="url(#riv-g)" stroke-width="4.5"
    stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
  <text font-family="IM Fell English" font-size="9" fill="rgba(80,140,210,.6)" font-style="italic">
    <textPath href="#hh" startOffset="15%">黄河 · Río Amarillo</textPath></text>

  <!-- YANGTZÉ -->
  <polyline id="yy" points="${rPts(yyPts)}"
    fill="none" stroke="url(#riv-g)" stroke-width="5.5"
    stroke-linecap="round" stroke-linejoin="round" opacity=".78"/>
  <text font-family="IM Fell English" font-size="9.5" fill="rgba(80,140,210,.6)" font-style="italic">
    <textPath href="#yy" startOffset="10%">长江 · Yangtzé</textPath></text>

  <!-- Río Wei -->
  <polyline points="${rPts(weiPts)}"
    fill="none" stroke="url(#riv-g)" stroke-width="2.5" opacity=".55"/>
  <!-- Río Han -->
  <polyline points="${rPts(hanPts)}"
    fill="none" stroke="url(#riv-g)" stroke-width="2.5" opacity=".5"/>`;

  // Lagos
  s+=`
  <ellipse cx="${lx(113.2)}" cy="${ly(29.4)}" rx="14" ry="8"
    fill="#2a4a7a" opacity=".55" stroke="#4a8fc0" stroke-width="0.8"/>
  <text x="${lx(113.2)}" y="${ly(29.0)}" text-anchor="middle"
    font-family="Noto Serif SC" font-size="6.5" fill="rgba(100,160,210,.55)">洞庭湖</text>
  <ellipse cx="${lx(116.5)}" cy="${ly(29.0)}" rx="8" ry="13"
    fill="#2a4a7a" opacity=".48" stroke="#4a8fc0" stroke-width="0.8"/>
  <text x="${lx(116.5)}" y="${ly(28.5)}" text-anchor="middle"
    font-family="Noto Serif SC" font-size="6" fill="rgba(100,160,210,.5)">鄱陽</text>`;

  // ══ MONTAÑAS — símbolos en posición correcta ══
  const mtns=[
    // Qinling
    [104.2,33.5],[106,33.5],[108,33.5],[110,33.5],
    // Taihang
    [113,36],[113,37],[113,38],[113,39],
    // Daxue (oeste Sichuan)
    [101,30],[101,31],[101,32],
  ];
  s+=`\n  <g opacity=".52">`;
  mtns.forEach(([lo,la])=>{
    const mx=lx(lo), my=ly(la);
    s+=`<path d="M${mx-7},${+my+5} L${mx},${+my-6} L${+mx+7},${+my+5}" fill="rgba(180,140,80,.2)" stroke="#8a6030" stroke-width="1.1"/>
    <path d="M${mx-4},${+my+5} L${+mx+2},${+my} L${+mx+6},${+my+5}" fill="none" stroke="#8a6030" stroke-width=".75"/>`;
  });
  s+=`\n  </g>`;

  // ══ BORDE DIVISORIO ENTRE ZHOU (líneas internas) ══
  if(!focusZ){
    s+=`\n  <g opacity=".35" stroke="#7a5520" stroke-width="0.7" fill="none" stroke-dasharray="4,3">`;
    ZHOU.forEach(z=>{
      s+=`<path d="${z.path}"/>`;
    });
    s+=`\n  </g>`;
  }

  // ══ NOMBRES DE ZHOU ══
  if(showN){
    s+=`\n  <g id="g-names">`;
    ZHOU.forEach(z=>{
      const nx=lx(z.lon), ny=ly(z.lat);
      const isF=focusZ&&focusZ.id===z.id;
      const dim=focusZ&&!isF;
      const op=dim?0.2:isF?1:0.8;
      const sz=isF?22:14;
      s+=`<text x="${nx}" y="${ny}" text-anchor="middle"
        font-family="Noto Serif SC,serif" font-size="${sz}" font-weight="700"
        fill="rgba(20,10,0,${op})" pointer-events="none">${z.zh}</text>
      <text x="${nx}" y="${+ny+sz*0.95}" text-anchor="middle"
        font-family="Noto Sans SC,sans-serif" font-size="${isF?10:7.5}"
        fill="rgba(20,10,0,${op*0.65})" pointer-events="none">${z.en}</text>`;
    });
    s+=`\n  </g>`;
  }

  // ══ CIUDADES ══
  if(showC){
    s+=`\n  <g id="g-cities">`;
    const citiesToShow=focusZ
      ? (focusZ.cities||[]).map(k=>({k,c:CITIES[k]})).filter(x=>x.c)
      : Object.entries(CITIES).map(([k,c])=>({k,c}));

    citiesToShow.forEach(({k,c})=>{
      const cx=lx(c.lon), cy=ly(c.lat);
      const r=c.cap?(focusZ?9:6.5):(focusZ?6.5:4.5);
      const col=c.cap?'#f0d050':'#c8a840';
      const sw=c.cap?1.8:1;
      const fs=c.cap?(focusZ?11:9):(focusZ?9:7.5);
      s+=`\n    <g class="city-pin" onclick="clickCity(event,'${k}')">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="${col}" opacity=".9"
          stroke="${c.cap?'#8a5800':'#7a4800'}" stroke-width="${sw}"
          ${c.cap?'filter="url(#gl)"':''}/>
        ${c.cap?`<polygon points="${cx},${+cy-r-5} ${+cx+3.5},${+cy-r} ${cx},${+cy-r+2.5} ${+cx-3.5},${+cy-r}"
          fill="#c0392b" opacity=".85"/>`:``}
        <text x="${+cx+r+3}" y="${+cy+4}" font-family="Noto Serif SC,serif"
          font-size="${fs}" fill="${c.cap?'#f0d070':'rgba(230,200,140,.82)'}"
          font-weight="${c.cap?'700':'400'}" pointer-events="none">${c.zh}${c.cap?' ★':''}</text>
      </g>`;
    });
    s+=`\n  </g>`;
  }

  // ══ PERSONAJES ══
  if(showPP && P){
    s+=`\n  <g id="g-chars">`;
    const placed={};
    const charsToShow=focusZ
      ? P.chars.filter(ch=>ch.zhou===selZ)
      : P.chars;

    charsToShow.forEach((ch)=>{
      const z=ZHOU.find(x=>x.id===ch.zhou); if(!z)return;
      const k=ch.zhou;
      const n=placed[k]||0; placed[k]=n+1;
      const angle=n*(Math.PI*2/6)- Math.PI/2;
      const dist=focusZ?(n===0?0:40):(n===0?0:26);
      const px=(+lx(z.lon)+Math.cos(angle)*dist).toFixed(1);
      const py=(+ly(z.lat)+22+Math.sin(angle)*dist).toFixed(1);
      const r=focusZ?14:10;
      const ir=focusZ?9:6;
      const fs=focusZ?10:8;
      const f=FAC[ch.f]||FAC.neut;
      const idx=P.chars.indexOf(ch);
      s+=`\n    <g class="char-pin" onclick="clickChar(event,${idx})">
        <circle cx="${px}" cy="${py}" r="${r}" fill="${f.c}" fill-opacity=".22"
          stroke="${f.c}" stroke-width="${focusZ?2.2:1.8}"/>
        <circle cx="${px}" cy="${py}" r="${ir}" fill="${f.c}" fill-opacity=".92"/>
        <text x="${px}" y="${+py+fs*0.38}" text-anchor="middle"
          font-size="${fs}" fill="white" font-family="Noto Serif SC"
          pointer-events="none">${f.s}</text>
        <text x="${px}" y="${+py-(focusZ?19:14)}" text-anchor="middle"
          font-size="${focusZ?9.5:7.5}" fill="${f.c}" font-family="Noto Serif SC"
          pointer-events="none">${ch.n.split(' ')[0]}</text>
        ${focusZ?`<text x="${px}" y="${+py+(focusZ?26:0)}" text-anchor="middle"
          font-size="13" pointer-events="none">${ch.e}</text>`:''}
      </g>`;
    });
    s+=`\n  </g>`;
  }

  // ══ DECORACIÓN ══
  // Título cartográfico
  s+=`
  <rect x="${vx+10}" y="${vy+10}" width="178" height="60" rx="2"
    fill="rgba(5,2,0,.84)" stroke="rgba(201,168,76,.4)" stroke-width="1"/>
  <text x="${vx+99}" y="${vy+34}" text-anchor="middle" font-family="Noto Serif SC,serif"
    font-size="19" font-weight="900" fill="#c9a84c" filter="url(#gl)">三國演義</text>
  <text x="${vx+99}" y="${vy+50}" text-anchor="middle" font-family="Cinzel Decorative,serif"
    font-size="8" fill="rgba(201,168,76,.68)" letter-spacing="1">ROMANCE DE LOS TRES REINOS</text>
  <text x="${vx+99}" y="${vy+63}" text-anchor="middle" font-family="IM Fell English,serif"
    font-size="8.5" fill="rgba(201,168,76,.48)" font-style="italic">168–316 d.C.</text>`;

  // Brújula
  const bx=vx+vw-40, by=vy+40;
  s+=`
  <g transform="translate(${bx},${by})">
    <circle r="26" fill="rgba(5,2,0,.88)" stroke="rgba(201,168,76,.42)" stroke-width="1.4"/>
    <circle r="19" fill="none" stroke="rgba(201,168,76,.18)" stroke-width=".7"/>
    <text y="-13" text-anchor="middle" fill="rgba(201,168,76,.8)" font-size="10" font-family="Noto Serif SC">北</text>
    <text y="19" text-anchor="middle" fill="rgba(201,168,76,.65)" font-size="9" font-family="Noto Serif SC">南</text>
    <text x="15" y="4" text-anchor="middle" fill="rgba(201,168,76,.65)" font-size="9" font-family="Noto Serif SC">东</text>
    <text x="-15" y="4" text-anchor="middle" fill="rgba(201,168,76,.65)" font-size="9" font-family="Noto Serif SC">西</text>
    <polygon points="0,-19 3.5,0 0,19 -3.5,0" fill="#c0392b" opacity=".85"/>
    <polygon points="0,-19 3.5,0 0,0 -3.5,0" fill="rgba(255,255,255,.55)"/>
    <circle r="3.5" fill="#c9a84c"/>
  </g>`;

  // Leyenda factiones
  if(P){
    const fks=[...new Set(Object.values(RF[P.id]))].slice(0,6);
    s+=`\n  <g>`;
    fks.forEach((fk,i)=>{
      const f=FAC[fk]; if(!f)return;
      const lbx=vx+12, lby=vy+vh-14-i*16;
      s+=`<circle cx="${lbx+6}" cy="${lby}" r="5" fill="${f.c}" opacity=".85"/>
      <text x="${lbx+15}" y="${lby+4}" font-family="Noto Sans SC,sans-serif"
        font-size="9.5" fill="rgba(201,168,76,.72)">${f.n}</text>`;
    });
    s+=`\n  </g>`;
  }

  s+=`\n</svg>`;
  return s;
}

// ══════════════════════════════════════════════════════════════
//  TOOLTIPS DINÁMICOS
// ══════════════════════════════════════════════════════════════
function attachTooltips(){
  document.querySelectorAll('.zreg-hit').forEach(el=>{
    el.removeEventListener('mouseenter',el._te);
    el.removeEventListener('mouseleave',el._tl);
    const id=el.id.replace('zp_','');
    const z=ZHOU.find(x=>x.id===id);
    if(!z)return;
    el._te=e=>tip(e,z.zh+' · '+z.en,z.desc.substring(0,72)+'…');
    el._tl=hidetip;
    el.addEventListener('mouseenter',el._te);
    el.addEventListener('mouseleave',el._tl);
  });
  document.querySelectorAll('.city-pin').forEach(el=>{
    const k=el.querySelector('[onclick]')?.getAttribute('onclick')?.match(/'(\w+)'/)?.[1];
    if(!k||!CITIES[k])return;
    const c=CITIES[k];
    el._te=e=>tip(e,c.zh+' '+c.en,c.info.substring(0,72)+'…');
    el._tl=hidetip;
    el.addEventListener('mouseenter',el._te);
    el.addEventListener('mouseleave',el._tl);
  });
  if(P){
    document.querySelectorAll('.char-pin').forEach(el=>{
      const oc=el.getAttribute('onclick');
      const m=oc&&oc.match(/\d+/);
      if(!m)return;
      const ch=P.chars[parseInt(m[0])];
      if(!ch)return;
      el._te=e=>tip(e,ch.n,ch.zi||'');
      el._tl=hidetip;
      el.addEventListener('mouseenter',el._te);
      el.addEventListener('mouseleave',el._tl);
    });
  }
}

function render(){
  document.getElementById('map-base').innerHTML=buildSVG();
  attachTooltips();
}

// ══════════════════════════════════════════════════════════════
//  EVENTOS
// ══════════════════════════════════════════════════════════════
function clickZ(id){
  selZ=id; level=1;
  document.getElementById('backbtn').style.display='block';
  updateBC(); render();
  if(P) updateInfoZ(id);
}
function clickCity(e,k){
  e.stopPropagation();
  const c=CITIES[k]; if(!c)return;
  document.getElementById('cminner').innerHTML=`
    <div class="cmnm">🏯 ${c.zh}</div>
    <div class="cmzi">${c.en}</div>
    <div class="cmbio" style="border-top:none;padding-top:0">${c.info}</div>`;
  document.getElementById('cmod').classList.add('open');
}
function clickChar(e,i){
  e.stopPropagation();
  if(!P)return;
  openModChar(P.chars[i]);
}
function goL0(){
  level=0;selZ=null;
  document.getElementById('backbtn').style.display='none';
  updateBC();render();
  if(P)updateInfoP();
}
function updateBC(){
  const bc=document.getElementById('bc');
  let h=`<span class="bci ${level===0?'on':''}" onclick="goL0()">🗺 China Han</span>`;
  if(level===1&&selZ){
    const z=ZHOU.find(x=>x.id===selZ);
    h+=`<span class="bcsep">›</span><span class="bci on">${z.zh} ${z.en}</span>`;
  }
  bc.innerHTML=h;
}

function updateInfoP(){
  if(!P)return;
  document.getElementById('izh').textContent=P.zh;
  document.getElementById('iname').textContent=P.n;
  document.getElementById('iyrs').textContent=P.y+' d.C.';
  let h=`<div class="idesc">${P.desc}</div>`;
  h+=`<div class="isect">⚔ Figuras del Periodo</div>`;
  P.chars.forEach((ch,i)=>{
    const f=FAC[ch.f]||FAC.neut;
    h+=`<div class="crow" style="--fc:${f.c}" data-ci="${i}">
      <div class="cico">${ch.e}</div>
      <div><div class="cnm">${ch.n}</div><div class="csb">${f.n}</div></div>
    </div>`;
  });
  h+=`<div class="isect" style="margin-top:5px">📜 Eventos</div>`;
  (P.events||[]).forEach(ev=>{
    h+=`<div class="erow"><div class="eyr">${ev.y} d.C.</div><div class="etxt">${ev.t}</div></div>`;
  });
  document.getElementById('ibody').innerHTML=h;
  document.querySelectorAll('.crow[data-ci]').forEach(r=>{
    r.addEventListener('click',()=>openModChar(P.chars[parseInt(r.dataset.ci)]));
  });
}

function updateInfoZ(zid){
  if(!P)return;
  const z=ZHOU.find(x=>x.id===zid);
  const f=FAC[(RF[P.id]||{})[zid]||'neut']||FAC.neut;
  const zhc=P.chars.filter(ch=>ch.zhou===zid);
  let h=`<div class="idesc">${z.desc}</div>`;
  h+=`<div style="display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid ${f.c};border-radius:2px;margin:3px 0;font-family:Noto Sans SC,sans-serif;font-size:9.5px;color:${f.c};background:${f.c}12">${f.s} · ${f.n}</div>`;
  if(zhc.length){
    h+=`<div class="isect" style="margin-top:5px">⚔ Figuras en ${z.zh}</div>`;
    zhc.forEach(ch=>{
      const fc=FAC[ch.f]||FAC.neut;
      h+=`<div class="crow" style="--fc:${fc.c}" data-ci="${P.chars.indexOf(ch)}">
        <div class="cico">${ch.e}</div>
        <div><div class="cnm">${ch.n}</div><div class="csb">${fc.n}</div></div>
      </div>`;
    });
  } else {
    h+=`<div class="isect" style="margin-top:5px">Ciudades de ${z.zh}</div>`;
    (z.cities||[]).forEach(ck=>{
      const c=CITIES[ck]; if(!c)return;
      h+=`<div style="padding:4px 6px;background:rgba(255,255,255,.02);border-radius:2px;
        margin-bottom:3px;border-left:2px solid rgba(201,168,76,.25)">
        <div style="font-family:Noto Serif SC,serif;font-size:11px;color:var(--parch)">${c.zh} <span style="opacity:.5;font-family:Noto Sans SC;font-size:9px">${c.en}</span></div>
        <div style="font-family:Noto Sans SC,sans-serif;font-size:9px;color:var(--parch2);margin-top:1px;opacity:.7">${c.info.substring(0,70)}…</div>
      </div>`;
    });
  }
  document.getElementById('ibody').innerHTML=h;
  document.querySelectorAll('.crow[data-ci]').forEach(r=>{
    r.addEventListener('click',()=>openModChar(P.chars[parseInt(r.dataset.ci)]));
  });
}

function openModChar(ch){
  const f=FAC[ch.f]||FAC.neut;
  const st=(ch.st||[]).map(([l,v])=>`<div class="cmsb"><div class="cmsl">${l}</div><div class="cmsv">${v}</div></div>`).join('');
  document.getElementById('cminner').innerHTML=`
    <div class="cmnm">${ch.e} ${ch.n}</div>
    <div class="cmzi">${ch.zi||''}</div>
    <div class="cmbadge" style="color:${f.c};border-color:${f.c};background:${f.c}14">${f.s} · ${f.n}</div>
    <div class="cmbio">${ch.bio||''}</div>
    ${st?`<div class="cmst">${st}</div>`:''}`;
  document.getElementById('cmod').classList.add('open');
}

function tip(e,t,s){
  const el=document.getElementById('tip');
  el.innerHTML=`<strong>${t}</strong>${s?`<br><span style="opacity:.6;font-size:9px">${s}</span>`:''}`;
  el.style.display='block';
  el.style.left=(e.clientX+13)+'px';
  el.style.top=Math.min(e.clientY-5,window.innerHeight-65)+'px';
}
function hidetip(){document.getElementById('tip').style.display='none';}
document.addEventListener('mousemove',e=>{
  const el=document.getElementById('tip');
  if(el.style.display!=='none'){
    el.style.left=(e.clientX+13)+'px';
    el.style.top=Math.min(e.clientY-5,window.innerHeight-65)+'px';
  }
});

function tog(t){
  if(t==='n'){showN=!showN;document.getElementById('bn').classList.toggle('on',showN);}
  if(t==='c'){showC=!showC;document.getElementById('bc2').classList.toggle('on',showC);}
  if(t==='p'){showPP=!showPP;document.getElementById('bp').classList.toggle('on',showPP);}
  render();
}

function initTL(){
  const sc=document.getElementById('tlsc');
  const rail=sc.querySelector('.tlr');
  sc.innerHTML=''; sc.appendChild(rail);
  PERIODS.forEach(pp=>{
    const el=document.createElement('div');
    el.className='pc'; el.id='pc-'+pp.id;
    el.innerHTML=`<div class="pcico" style="border-color:${pp.c};color:${pp.c}">${pp.ico}</div>
      <div class="pcdot" style="border-color:${pp.c}"></div>
      <div class="pcstem"></div>
      <div class="pclbl">${pp.n}</div>
      <div class="pcyr">${pp.y} d.C.</div>`;
    el.addEventListener('click',()=>selP(pp.id));
    sc.appendChild(el);
  });
}

function selP(id){
  const pp=PERIODS.find(x=>x.id===id); if(!pp)return;
  P=pp;
  document.querySelectorAll('.pc').forEach(c=>c.classList.remove('on'));
  document.getElementById('pc-'+id)?.classList.add('on');
  level=0;selZ=null;
  document.getElementById('backbtn').style.display='none';
  updateBC();render();updateInfoP();
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape')document.getElementById('cmod').classList.remove('open');
});

initTL();
render();
setTimeout(()=>selP('p1'),280);
</script>
</body>
</html>
