//  MAPA BASE: SVG real de China Han con paths geográficos precisos
//  Basado en proyección simple sobre viewBox 800×750
//  Las regiones tienen paths reales calibrados manualmente

// Calibración para la imagen acuarela Map.webp (3840×3024, aspecto 1.27).
// Iteración 3 — microajuste: tras 2 screenshots con Chengdu/Jianye sesgados al
// oeste, desplazamos el rango longitudinal 1° hacia el oeste manteniendo el
// span (28°). Esto desplaza TODOS los pines ~29 viewBox-px al este uniforme.
//   longitud: 99°E (oeste) → 127°E (este)  → 28°
//   latitud:  44°N (norte) → 17°N (sur)    → 27°
// ViewBox SVG: 800×630 (aspecto 1.27, idéntico a la imagen)
// Anclas para sanidad (post-iter3):
//   Chengdu  104.1°E 30.6°N → ~ x=146,  y=312  (más adentro de cuenca Sichuan)
//   Chang'an 108.9°E 34.3°N → ~ x=283,  y=226
//   Luoyang  112.5°E 34.7°N → ~ x=386,  y=217
//   Jianye   118.8°E 32.1°N → ~ x=566,  y=278  (más cerca del delta Yangtzé)

function lx(lon){ return ((lon-99)*28.57).toFixed(1) }   // 800/28 = 28.57 px/°lon
function ly(lat){ return ((44-lat)*23.33).toFixed(1) }   // 630/27 = 23.33 px/°lat
function lxy(lon,lat){ return lx(lon)+','+ly(lat) }

// Helper: rectángulo geográfico de (a,b)=(lonW,latS) a (c,d)=(lonE,latN)
// Útil para definir hit-areas de zhou que cubren el área donde sus ciudades viven.
function rect(a,b,c,d){return `M ${lxy(a,d)} L ${lxy(c,d)} L ${lxy(c,b)} L ${lxy(a,b)} Z`}

// ══════════════════════════════════════════════════════════════
//  ESTADO Y RENDER
// ══════════════════════════════════════════════════════════════
// WATERCOLOR=true → la imagen acuarela es el fondo de #mpanel.
//   El SVG omite el terreno procedural (mar, tierra, ríos, montañas, lagos,
//   brújula, cartucho de título). Las regiones zhou se dibujan con baja
//   opacidad como tinte de facción. Los pines/labels se ocultan por defecto
//   porque su calibración geográfica no coincide con la imagen aún.
const WATERCOLOR=true;

let P=null, level=0, selZ=null;
let showN=true, showC=true, showPP=true;
let highlightFac=null; // facción resaltada desde la leyenda izquierda

const VW=800, VH=630;  // Aspecto 1.27 = mismo que Map.webp (3840×3024)

// ViewBox actual (animado). buildSVG lo lee. animateZoom lo interpola.
let currentVB = [0, 0, VW, VH];
let zoomRAF = null;

function buildSVG(){
  const rf=P?RF[P.id]:{};
  const focusZ = level===1 ? ZHOU.find(z=>z.id===selZ) : null;

  // viewBox = currentVB (cámara). animateVB la interpola al target en cada
  // cambio de estado. Aquí solo emitimos el frame de partida para que el
  // contenido nuevo aparezca alineado con la posición actual de la cámara.
  const [vx,vy,vw,vh] = currentVB;

  let s=`<svg viewBox="${vx} ${vy} ${vw} ${vh}" xmlns="http://www.w3.org/2000/svg"
    preserveAspectRatio="xMidYMid meet"
    style="width:100%;height:100%;display:block">
  <defs>
    <filter id="gl"><feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="5"
      flood-color="#000" flood-opacity="0.6"/></filter>
    <filter id="gll"><feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    <!-- PATRÓN MAR — olas sutiles -->
    <pattern id="sea-wave" x="0" y="0" width="24" height="10" patternUnits="userSpaceOnUse">
      <path d="M0,5 Q6,2 12,5 Q18,8 24,5" fill="none" stroke="rgba(80,150,220,.18)" stroke-width="0.9"/>
    </pattern>
    <!-- PATRÓN TIERRA — textura pergamino -->
    <pattern id="land-tex" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <circle cx="2" cy="2" r="0.4" fill="rgba(100,60,10,.12)"/>
    </pattern>

    <!-- Gradiente tierra base -->
    <radialGradient id="land-g" cx="40%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#d8b878"/>
      <stop offset="50%" stop-color="#c49a50"/>
      <stop offset="100%" stop-color="#a07830"/>
    </radialGradient>
    <!-- Gradiente mar -->
    <linearGradient id="sea-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#0d2030"/>
    </linearGradient>
    <!-- Ríos -->
    <linearGradient id="riv-g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5090c8" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#3a6fa8" stop-opacity=".7"/>
    </linearGradient>
  </defs>

  `;

  // ══ IMAGEN ACUARELA (modo WATERCOLOR) ══
  // Embebida en el SVG → al cambiar viewBox para el zoom-a-zhou,
  // se recorta junto a los pines manteniendo alineación perfecta.
  if(WATERCOLOR){
    s+=`\n  <image href="img/Mapa/Map.webp" x="0" y="0" width="${VW}" height="${VH}"
      preserveAspectRatio="xMidYMid meet" style="pointer-events:none"/>`;
  }

  if(!WATERCOLOR){
    // ══ FONDO MAR (procedural) ══
    s+=`
  <rect width="${VW}" height="${VH}" fill="url(#sea-g)"/>
  <rect width="${VW}" height="${VH}" fill="url(#sea-wave)"/>`;

    if(!focusZ){
      s+=`
  <text x="720" y="380" text-anchor="middle" font-family="IM Fell English"
    font-style="italic" font-size="16" fill="rgba(100,160,220,.25)"
    transform="rotate(-8,720,380)">東 海</text>
  <text x="650" y="690" text-anchor="middle" font-family="IM Fell English"
    font-style="italic" font-size="14" fill="rgba(100,160,220,.2)">南 海</text>
  <text x="75" y="180" text-anchor="middle" font-family="IM Fell English"
    font-style="italic" font-size="12" fill="rgba(100,160,220,.15)">西 域</text>`;
    }

    // ══ TIERRA BASE (procedural) ══
    s+=`\n  <path d="${OUTER}" fill="url(#land-g)" stroke="#8a6020" stroke-width="1.8"
      filter="url(#sh)"/>
    <path d="${OUTER}" fill="url(#land-tex)"/>`;
  }

  // ══ ZHOU: hit-areas (siempre) + tinte (solo modo procedural) ══
  s+=`\n  <g id="g-zhou">`;
  ZHOU.forEach(z=>{
    const fk=rf[z.id]||'neut';
    const f=FAC[fk]||FAC.neut;
    const isSelected=focusZ&&focusZ.id===z.id;
    const dimmed=focusZ&&!isSelected;
    if(WATERCOLOR){
      // Highlight de facción desde la leyenda izquierda (no aplica en zoom).
      const isHL    = highlightFac && fk===highlightFac && !focusZ;
      const isHLDim = highlightFac && fk!==highlightFac && !focusZ;
      let fill='transparent', opa=1, stroke='transparent', sw=0;
      if(isSelected){ fill=f.fill; opa=0.38; stroke=f.c; sw=2.5; }
      else if(isHL){ fill=f.fill; opa=0.52; stroke=f.c; sw=1.8; }
      else if(dimmed){ opa=0; }
      else if(isHLDim){ opa=0.16; }
      s+=`\n    <path id="zp_${z.id}"
        d="${z.path}"
        fill="${fill}" opacity="${opa}"
        stroke="${stroke}" stroke-width="${sw}"
        ${focusZ?'':`class="zreg-hit" style="cursor:pointer"`}
        ${!focusZ?`onclick="clickZ('${z.id}')"`:''}
      />`;
    } else {
      const op  = dimmed?0.3:0.92;
      const stroke = isSelected?f.c:'rgba(60,40,10,.5)';
      const sw = isSelected?2.2:0.9;
      s+=`\n    <path id="zp_${z.id}"
        d="${z.path}"
        fill="${f.fill}" stroke="${stroke}"
        stroke-width="${sw}" opacity="${op}"
        ${focusZ?'':`class="zreg-hit" style="cursor:pointer"`}
        ${!focusZ?`onclick="clickZ('${z.id}')"`:''}
        ${isSelected?'filter="url(#gll)"':''}
      />`;
    }
  });
  s+=`\n  </g>`;

  if(!WATERCOLOR){
    // ══ RÍOS (procedural) ══
    const hhPts=[[96,36],[98,36],[100,36],[102,36],[103,37],[104,37],[104,38],[103,38],
      [105,38],[106,40],[107,40],[108,40],[109,40],[110,40],[111,40],[111,39],
      [111,38],[110,37],[110,36],[111,35],[112,35],[113,35],[114,35],[115,35],
      [116,35],[117,36],[118,36],[119,36],[120,37],[121,37]];
    const yyPts=[[98,30],[100,28],[101,28],[102,28],[103,28],[104,29],[105,29],
      [106,29],[107,29],[108,30],[109,30],[110,30],[111,29],[112,30],[113,30],

      <text x="-15" y="4" text-anchor="middle" fill="rgba(201,168,76,.65)" font-size="9" font-family="Noto Serif SC">西</text>

    if(P){
      const fks=[...new Set(Object.values(RF[P.id]))].slice(0,6);
      s+=`\n  <g>`;
      fks.forEach((fk,i)=>{

        s+=`<circle cx="${lbx+6}" cy="${lby}" r="5" fill="${f.c}" opacity=".85"/>

  s+=`\n</svg>`;

function attachTooltips(){
  document.querySelectorAll('.zreg-hit').forEach(el=>{
    el.removeEventListener('mouseenter',el._te);
    el.removeEventListener('mouseleave',el._tl);
    const id=el.id.replace('zp_','');
    const z=ZHOU.find(x=>x.id===id);
    if(!z)return;
    el._te=e=>tip(e,z.zh+' · '+z.en,z.desc.substring(0,72)+'…');
    el._tl=hidetip;
    el.addEventListener('mouseenter',el._te);
    el.addEventListener('mouseleave',el._tl);
  });
  document.querySelectorAll('.city-pin').forEach(el=>{
    const k=el.querySelector('[onclick]')?.getAttribute('onclick')?.match(/'(\w+)'/)?.[1];
    if(!k||!CITIES[k])return;
    const c=CITIES[k];
    el._te=e=>tip(e,c.zh+' '+c.en,c.info.substring(0,72)+'…');
    el._tl=hidetip;
    el.addEventListener('mouseenter',el._te);
    el.addEventListener('mouseleave',el._tl);
  });
  if(P){
    document.querySelectorAll('.char-pin').forEach(el=>{
      const oc=el.getAttribute('onclick');
      const m=oc&&oc.match(/\d+/);
      if(!m)return;
      const ch=P.chars[parseInt(m[0])];
      if(!ch)return;
      el._te=e=>tip(e,ch.n,ch.zi||'');
      el._tl=hidetip;
      el.addEventListener('mouseenter',el._te);
      el.addEventListener('mouseleave',el._tl);
    });
  }
}

function render(){
  document.getElementById('map-base').innerHTML=buildSVG();
  attachTooltips();
  animateVB(computeTargetVB());
}

// ══════════════════════════════════════════════════════════════
//  ANIMACIÓN VIEWBOX — zoom suave entre estados
// ══════════════════════════════════════════════════════════════
// Calcula el viewBox de destino según level/selZ. Si hay zhou enfocada,
// devuelve su bbox geográfica con margen; si no, el mapa completo.
function computeTargetVB(){
  if(level===1 && selZ){
    const z = ZHOU.find(x=>x.id===selZ);
    if(z){
      const coords=[];
      z.path.replace(/[\d.]+,[\d.]+/g, m=>{coords.push(m.split(',').map(Number));});
      if(coords.length){
        const xs=coords.map(c=>c[0]), ys=coords.map(c=>c[1]);
        const margin=50;
        const tx=Math.max(0,Math.min(...xs)-margin);
        const ty=Math.max(0,Math.min(...ys)-margin);
        const tw=Math.min(VW,Math.max(...xs)+margin)-tx;
        const th=Math.min(VH,Math.max(...ys)+margin)-ty;
        return [tx,ty,tw,th];
      }
    }
  }
  return [0,0,VW,VH];
}

function easeOutCubic(t){ return 1 - Math.pow(1-t, 3); }

// Interpola currentVB → target en `dur` ms con rAF. Cancela animación previa.
function animateVB(target, dur){
  if(dur===undefined) dur = 540;
  if(zoomRAF){ cancelAnimationFrame(zoomRAF); zoomRAF = null; }
  const svg = document.querySelector('#map-base svg');
  if(!svg) return;
  // Si ya estamos prácticamente en el destino, fija sin animar.
  const close = currentVB.every((v,i)=>Math.abs(v-target[i])<0.5);
  if(close){
    currentVB = target.slice();
    svg.setAttribute('viewBox', currentVB.join(' '));
    return;
  }
  const start = currentVB.slice();
  const t0 = performance.now();
  function step(now){
    const e = Math.min(1, (now-t0)/dur);
    const k = easeOutCubic(e);
    currentVB = start.map((s,i)=> s + (target[i]-s)*k);
    svg.setAttribute('viewBox', currentVB.map(v=>v.toFixed(2)).join(' '));
    if(e<1){ zoomRAF = requestAnimationFrame(step); }
    else { zoomRAF = null; currentVB = target.slice();
      svg.setAttribute('viewBox', currentVB.join(' ')); }
  }
  zoomRAF = requestAnimationFrame(step);
}

function clickZ(id){
  selZ=id; level=1;
  document.getElementById('backbtn').classList.add('show');
  updateBC(); render();
  if(P) updateInfoZ(id);
  openDrawer();
}
function clickCity(e,k){
  e.stopPropagation();
  const c=CITIES[k]; if(!c)return;
  document.getElementById('cminner').innerHTML=`
    <div class="cmnm">🏯 ${c.zh}</div>
    <div class="cmzi">${c.en}</div>
    <div class="cmbio" style="border-top:none;padding-top:0">${c.info}</div>`;
  document.getElementById('cmod').classList.add('open');
}
function clickChar(e,i){
  e.stopPropagation();
  if(!P)return;
  openModChar(P.chars[i]);
}
function goL0(){
  level=0;selZ=null;
  document.getElementById('backbtn').classList.remove('show');
  updateBC();render();
  if(P)updateInfoP();
}
function updateBC(){
  const bcsub=document.getElementById('bcsub');
  const bci=document.querySelector('#bc .bci');
  if(level===1&&selZ){
    const z=ZHOU.find(x=>x.id===selZ);
    bci.classList.remove('on');
    bcsub.innerHTML=`<span class="bcsep">›</span><span class="bci on">${z.zh} ${z.en}</span>`;
  } else {
    bci.classList.add('on');
    bcsub.innerHTML='';
  }
}

function updateInfoP(){
  if(!P)return;
  document.getElementById('dzh').textContent=P.zh;
  document.getElementById('dname').textContent=P.n;
  document.getElementById('dyrs').textContent=P.y+' d.C.';

  h+=`<div class="isect">⚔ Figuras del Periodo</div>`;
  P.chars.forEach((ch,i)=>{
    const f=FAC[ch.f]||FAC.neut;
    h+=`<div class="crow" style="--fc:${f.c}" data-ci="${i}">
      <div class="cico">${ch.e}</div>
      <div><div class="cnm">${ch.n}</div><div class="csb">${f.n}</div></div>

      h+=`<div class="erow"><div class="eyr">${ev.y} d.C.</div><div class="etxt">${ev.t}</div></div>`;
    });

  document.querySelectorAll('.crow[data-ci]').forEach(r=>{
    r.addEventListener('click',()=>openModChar(P.chars[parseInt(r.dataset.ci)]));
  });

function updateInfoZ(zid){
  if(!P)return;
  const z=ZHOU.find(x=>x.id===zid);
  const f=FAC[(RF[P.id]||{})[zid]||'neut']||FAC.neut;
  const zhc=P.chars.filter(ch=>ch.zhou===zid);
  const reg=(typeof REGENTS!=='undefined' && REGENTS[P.id] && REGENTS[P.id][zid]) || null;

  document.getElementById('dzh').textContent=z.zh;
  document.getElementById('dname').textContent=z.en;
  document.getElementById('dyrs').textContent=P.n+' · '+P.y+' d.C.';

  let h=`<div class="idesc">${z.desc}</div>`;
  h+=`<div class="fbadge" style="border-color:${f.c};color:${f.c};background:${f.c}1c">${f.s} · ${f.n}</div>`;

  // Línea de control faccional a través de los 10 períodos —
  // permite leer de un vistazo cómo cambió el dueño de esta zhou.
  h+=`<div class="isect">📜 Control a través del tiempo</div>`;
  h+=`<div class="zft">`;
  PERIODS.forEach(pp=>{
    const fk=(RF[pp.id]||{})[zid]||'neut';
    const ff=FAC[fk]||FAC.neut;
    const cur=P&&pp.id===P.id;
    h+=`<div class="zft-dot${cur?' on':''}" data-pid="${pp.id}"
      style="--fc:${ff.c}"
      title="${pp.n} · ${pp.y} d.C. — ${ff.n}">
      <span class="zft-s">${ff.s}</span>
      <span class="zft-yr">${pp.y.split('–')[0].replace('~','')}</span>
    </div>`;
  });
  h+=`</div>`;

  h+=`<div class="isect">👑 Regente</div>
    <div class="regent">${reg||'<span class="dim">— sin datos para esta era —</span>'}</div>`;
  if(zhc.length){
    h+=`<div class="isect">⚔ Figuras en ${z.zh}</div>`;
    zhc.forEach(ch=>{
      const fc=FAC[ch.f]||FAC.neut;
      h+=`<div class="crow" style="--fc:${fc.c}" data-ci="${P.chars.indexOf(ch)}">
        <div class="cico">${ch.e}</div>
        <div><div class="cnm">${ch.n}</div><div class="csb">${fc.n}</div></div>
      </div>`;
    });
  }
  if((z.cities||[]).length){
    h+=`<div class="isect">🏯 Ciudades</div>`;
    (z.cities||[]).forEach(ck=>{
      const c=CITIES[ck]; if(!c)return;
      h+=`<div class="cbox" onclick="clickCity(event,'${ck}')">
        <div class="cbnm">${c.zh} <span class="cben">${c.en}</span>${c.cap?' <span class="cbstar">★</span>':''}</div>
        <div class="cbinfo">${c.info}</div>
      </div>`;
    });
  }
  document.getElementById('dbody').innerHTML=h;
  document.querySelectorAll('.crow[data-ci]').forEach(r=>{
    r.addEventListener('click',()=>openModChar(P.chars[parseInt(r.dataset.ci)]));
  });
  // Click en un dot de la línea temporal: cambia el período manteniendo
  // el zoom actual sobre esta zhou y refresca el panel de información.
  document.querySelectorAll('.zft-dot').forEach(d=>{
    d.addEventListener('click',()=>{
      const pp=PERIODS.find(x=>x.id===d.dataset.pid); if(!pp)return;
      P=pp;
      document.querySelectorAll('.pc').forEach(c=>c.classList.remove('on'));
      document.getElementById('pc-'+pp.id)?.classList.add('on');
      render();
      updateInfoZ(zid);
    });
  });
}

// Mapeo manual de nombre → slug para casos donde el slugify automático falla
// (romanizaciones alternativas, separación distinta, etc.).
const FICHA_OVERRIDE={
  'Zhang Jue':'zhang-jiao',     // 张角 — variante de romanización
  'Diaochan':'diao-chan',       // archivo escrito con guión
};

// Convierte un nombre a su slug de archivo, devolviendo null si no hay ficha.
function fichaSlug(name){
  if(!name) return null;
  if(name in FICHA_OVERRIDE) return FICHA_OVERRIDE[name];
  // Strip combining diacritics (Lü→Lu) usando rango Unicode 0300–036F
  const s = name
    .normalize('NFD').replace(new RegExp('[\\u0300-\\u036f]','g'),'')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'');
  return FICHAS_AVAILABLE.has(s) ? s : null;
}

function openModChar(ch){
  const f=FAC[ch.f]||FAC.neut;
  const st=(ch.st||[]).map(([l,v])=>`<div class="cmsb"><div class="cmsl">${l}</div><div class="cmsv">${v}</div></div>`).join('');
  const slug=fichaSlug(ch.n);
  const fichaBtn = slug
    ? `<a class="cmficha" href="Periods/${slug}.html">Ver Ficha Completa →</a>`
    : '';
  document.getElementById('cminner').innerHTML=`
    <div class="cmnm">${ch.e} ${ch.n}</div>
    <div class="cmzi">${ch.zi||''}</div>
    <div class="cmbadge" style="color:${f.c};border-color:${f.c};background:${f.c}14">${f.s} · ${f.n}</div>
    <div class="cmbio">${ch.bio||''}</div>
    ${st?`<div class="cmst">${st}</div>`:''}
    ${fichaBtn}`;
  document.getElementById('cmod').classList.add('open');
}

function tip(e,t,s){
  const el=document.getElementById('tip');
  el.innerHTML=`<strong>${t}</strong>${s?`<br><span style="opacity:.6;font-size:9px">${s}</span>`:''}`;
  el.style.display='block';
  el.style.left=(e.clientX+13)+'px';
  el.style.top=Math.min(e.clientY-5,window.innerHeight-65)+'px';
}
function hidetip(){document.getElementById('tip').style.display='none';}
document.addEventListener('mousemove',e=>{

function initTL(){
  const sc=document.getElementById('tlsc');
  sc.innerHTML='';
  PERIODS.forEach(pp=>{
    const el=document.createElement('div');
    el.className='pc'; el.id='pc-'+pp.id;
    el.innerHTML=`<div class="pcico" style="border-color:${pp.c};color:${pp.c}">${pp.ico}</div>
      <div class="pcdot" style="border-color:${pp.c}"></div>
      <div class="pcstem"></div>
      <div class="pclbl">${pp.n}</div>
      <div class="pcyr">${pp.y} d.C.</div>`;
    el.addEventListener('click',()=>selP(pp.id,{openPanel:true}));
    sc.appendChild(el);
  });
}

// ══════════════════════════════════════════════════════════════
//  LEYENDA IZQUIERDA — facciones activas en el período
// ══════════════════════════════════════════════════════════════
// Cuenta territorios (de RF) y figuras (de P.chars) por facción y
// renderiza una fila por cada una. Click resalta la facción en el mapa.
function buildLegend(){
  const lt=document.getElementById('ltitle');
  const ly=document.getElementById('lyrs');
  const lb=document.getElementById('lbody');
  if(!lt||!lb)return;
  if(!P){
    lt.textContent='FACCIONES';
    ly.textContent='— Selecciona un período —';
    lb.innerHTML='<div class="lfempty">⚜<br>Sin era seleccionada</div>';
    return;
  }
  const rf=RF[P.id]||{};
  const counts={};
  Object.values(rf).forEach(fk=>{
    if(!counts[fk]) counts[fk]={ter:0,fig:0};
    counts[fk].ter++;
  });
  P.chars.forEach(ch=>{
    if(!counts[ch.f]) counts[ch.f]={ter:0,fig:0};
    counts[ch.f].fig++;
  });
  const rows=Object.entries(counts)
    .sort((a,b)=> (b[1].ter-a[1].ter) || (b[1].fig-a[1].fig));

  lt.textContent='FACCIONES · '+P.zh;
  ly.textContent=P.y+' d.C.';
  let h='';
  rows.forEach(([fk,c])=>{
    const f=FAC[fk]||FAC.neut;
    const tl=c.ter===1?'territorio':'territorios';
    const fl=c.fig===1?'figura':'figuras';
    const cls=highlightFac
      ? (highlightFac===fk?'lfac act':'lfac dim')
      : 'lfac';
    h+=`<div class="${cls}" data-fk="${fk}" style="--fc:${f.c}">
      <div class="lfsg">${f.s}</div>
      <div class="lftxt">
        <div class="lfn">${f.n}</div>
        <div class="lfsub">${c.ter} ${tl} · ${c.fig} ${fl}</div>
      </div>
    </div>`;
  });
  lb.innerHTML=h;
  lb.querySelectorAll('.lfac').forEach(el=>{
    el.addEventListener('click',()=>{
      const fk=el.dataset.fk;
      highlightFac = (highlightFac===fk) ? null : fk;
      render();
      buildLegend();
    });
  });
}

function selP(id, opts){
  const pp=PERIODS.find(x=>x.id===id); if(!pp)return;
  P=pp;
  highlightFac=null;
  document.querySelectorAll('.pc').forEach(c=>c.classList.remove('on'));
  document.getElementById('pc-'+id)?.classList.add('on');
  level=0;selZ=null;
  updateBC();render();updateInfoP();buildLegend();
  if(opts&&opts.openPanel) openDrawer();
}

document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  // Cascada de salida: modal → drawer abierto → zoom → nada
  const cmod=document.getElementById('cmod');
  if(cmod.classList.contains('open')){ cmod.classList.remove('open'); return; }
  const drawer=document.getElementById('drawer');
  if(drawer.classList.contains('open')){ closeDrawer(); return; }
  if(level===1){ goL0(); return; }
});

initTL();
render();
setTimeout(()=>selP('p1'),280);
</script>
