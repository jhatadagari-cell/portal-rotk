<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Escaramuza · Combate (prototipo) · Portal ROTK</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Cinzel+Decorative:wght@400;700&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  /* ── Paleta DIEGÉTICA (campaña Han): pergamino, madera lacada, bronce, cinabrio ── */
  :root{
    --paper:#e8d7ac; --paper2:#d3ba82;          /* pergamino envejecido */
    --ink:#3a2a15; --ink2:#6b5836;              /* tinta / tinta desvaída */
    --wood:#2b1d10; --wood2:#4a3117;            /* madera lacada */
    --bronze:#a9803f; --bronze-d:#6a4a24; --bronze-hi:#e6c88a;
    --cinnabar-s:#a83424; --cinnabar-d:#7a2216;  /* sello rojo (cinabrio) */
    --jade:#537f5b;
    /* Cara de pergamino con marco de madera + filo de bronce (tablilla enmarcada) */
    --paper-face:
      radial-gradient(90% 75% at 16% 12%, rgba(255,250,226,.55), transparent 62%),
      radial-gradient(85% 85% at 88% 92%, rgba(110,80,40,.32), transparent 58%),
      linear-gradient(158deg, var(--paper) 0%, var(--paper2) 100%);
    --wood-face:
      repeating-linear-gradient(91deg, rgba(0,0,0,.18) 0 1px, transparent 1px 6px),
      linear-gradient(158deg, var(--wood2), var(--wood));
    --frame:
      inset 0 0 0 1px rgba(255,248,224,.4),
      inset 0 0 26px rgba(110,78,38,.30),
      0 0 0 4px var(--wood), 0 0 0 5px var(--bronze-d),
      0 10px 22px rgba(0,0,0,.55);
    --frame-dark:
      inset 0 0 0 1px var(--bronze), inset 0 0 24px rgba(0,0,0,.45),
      0 0 0 3px var(--wood), 0 0 0 4px var(--bronze-d), 0 8px 20px rgba(0,0,0,.55);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#000; color:var(--ink); overflow:hidden;
    font-family:'Noto Sans SC',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }

  /* La escena OCUPA toda la pantalla; el HUD se dibuja integrado encima del lienzo. */
  .hcb{ position:fixed; inset:0; }
  .hcb-scene{ position:absolute; inset:0; overflow:hidden; }
  .hcb-scene canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .hcb-shadow-top{ position:absolute; left:0; right:0; top:0; height:120px; pointer-events:none; z-index:2;
    background:linear-gradient(180deg,rgba(6,5,2,.55),rgba(6,5,2,0)); }

  /* ── Enemigo (arriba-izquierda): tablilla de guerra en madera lacada ── */
  .hcb-foehud{ position:absolute; top:16px; left:18px; width:min(360px,46vw); z-index:6; pointer-events:none;
    background:var(--wood-face); color:var(--paper); border-radius:4px; padding:9px 13px 11px;
    box-shadow:var(--frame-dark); }
  .hcb-foe-top{ font:700 15px 'Noto Serif SC',serif; color:var(--paper); margin-bottom:6px; letter-spacing:.01em; }
  .hcb-foe-zh{ font-family:'Noto Serif SC',serif; color:var(--bronze-hi); }
  .hcb-foe-row{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:7px; }
  .hcb-shield{ display:inline-flex; align-items:center; gap:5px; padding:2px 10px; border-radius:4px;
    background:linear-gradient(180deg,rgba(83,127,91,.4),rgba(40,64,44,.5)); border:1px solid var(--jade); font-size:13px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); }
  .hcb-shield b{ color:#cfe6cf; font-variant-numeric:tabular-nums; }
  .hcb-shield.broken{ background:linear-gradient(180deg,rgba(168,52,36,.45),rgba(90,24,16,.55)); border-color:var(--cinnabar-s); }
  .hcb-shield.broken b{ color:#f0c0b6; }
  .hcb-weak{ display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
  .hcb-weak-lbl{ font:700 9px 'Noto Serif SC',serif; letter-spacing:.05em; text-transform:uppercase; color:var(--bronze-hi); opacity:.85; }
  .hcb-wk{ display:inline-grid; place-items:center; min-width:24px; height:24px; padding:0 5px; border-radius:3px;
    background:rgba(0,0,0,.3); border:1px dashed var(--bronze); color:var(--bronze-hi); font-family:'Noto Serif SC',serif; font-size:14px; }
  .hcb-wk.on{ background:linear-gradient(180deg,var(--cinnabar-s),var(--cinnabar-d)); border:1px solid var(--bronze-hi); color:#ffe9d8; border-style:solid; box-shadow:0 0 8px rgba(168,52,36,.6), inset 0 0 0 1px rgba(255,255,255,.15); }
  /* Barra = ranura tallada con filo de bronce */
  .hcb-bar{ height:9px; border-radius:2px; background:rgba(20,12,4,.7); overflow:hidden; box-shadow:inset 0 1px 3px rgba(0,0,0,.6), 0 0 0 1px var(--bronze-d); }
  .hcb-bar span{ display:block; height:100%; transition:width .35s ease; box-shadow:inset 0 1px 0 rgba(255,255,255,.25); }
  .hcb-bar.hp span{ background:linear-gradient(180deg,#8ec062,#5f8f3e); }
  .hcb-bar.sp span{ background:linear-gradient(180deg,#77aed6,#3f6f9e); }
  .hcb-foe-hp{ font-size:11px; color:var(--paper); opacity:.85; margin-top:4px; font-variant-numeric:tabular-nums; }
  .hcb-break{ color:var(--bronze-hi); font-weight:700; }

  /* ── Orden de turnos (arriba-derecha): tarjas de madera colgadas ── */
  .hcb-timeline{ position:absolute; top:16px; right:18px; z-index:6; text-align:right; }
  .hcb-tl-lbl{ font:700 9.5px 'Noto Serif SC',serif; letter-spacing:.1em; text-transform:uppercase; color:var(--paper); opacity:.9; margin-bottom:7px; text-shadow:0 1px 3px #000; }
  .hcb-tl-row{ display:flex; gap:7px; align-items:center; justify-content:flex-end; flex-wrap:wrap; max-width:60vw; }
  .hcb-tl-chip{ width:34px; height:38px; border-radius:3px; display:grid; place-items:center;
    background:var(--wood-face); color:var(--paper); box-shadow:inset 0 0 0 1px var(--bronze), 0 0 0 2px var(--wood), 0 3px 8px rgba(0,0,0,.5);
    font-family:'Noto Serif SC',serif; font-size:16px; transition:transform .15s, box-shadow .15s; }
  .hcb-tl-chip.foe{ background:repeating-linear-gradient(91deg,rgba(0,0,0,.18) 0 1px,transparent 1px 6px),linear-gradient(158deg,#5a2018,#3a130d); color:#f0c0b6; }
  .hcb-tl-chip.cur{ transform:translateY(3px) scale(1.1); box-shadow:inset 0 0 0 1px var(--bronze-hi), 0 0 0 2px var(--wood), 0 5px 14px rgba(168,52,36,.5); color:var(--bronze-hi); }

  /* ── HUD inferior integrado (registro + banda + menú) ── */
  .hcb-hud{ position:absolute; left:0; right:0; bottom:0; z-index:7; padding:0 18px 18px;
    display:flex; flex-direction:column; gap:10px; pointer-events:none;
    background:linear-gradient(0deg,rgba(6,5,2,.62),rgba(6,5,2,0)); padding-top:44px; }
  .hcb-log{ align-self:center; max-width:min(640px,92%); text-align:center; min-height:20px;
    font:400 12.5px/1.5 'Noto Serif SC',serif; color:var(--paper); padding:5px 20px;
    background:radial-gradient(60% 100% at 50% 50%, rgba(20,14,6,.62), rgba(20,14,6,0) 78%);
    text-shadow:0 1px 3px #000, 0 0 10px rgba(0,0,0,.7); }
  .hcb-log-l b{ color:var(--bronze-hi); }
  .hcb-hud-row{ display:flex; align-items:flex-end; justify-content:space-between; gap:14px; }

  /* Placas de la banda (abajo-izquierda): tablillas de nombre en pergamino */
  .hcb-party{ display:flex; gap:10px; align-items:flex-end; flex:1 1 auto; min-width:0; }
  .hcb-pc{ flex:1 1 0; min-width:0; max-width:190px; pointer-events:auto;
    background:var(--paper-face); color:var(--ink); border-radius:4px; padding:8px 10px;
    box-shadow:var(--frame); transition:transform .16s, box-shadow .16s; }
  .hcb-pc.cur{ transform:translateY(-7px); box-shadow:var(--frame), 0 0 0 6px rgba(168,52,36,.22), 0 0 18px rgba(168,52,36,.35); }
  .hcb-pc.cur .hcb-pc-h{ color:var(--cinnabar-d); }
  .hcb-pc.dead{ opacity:.5; filter:grayscale(.55) sepia(.2); }
  .hcb-pc-h{ font:700 12.5px 'Noto Serif SC',serif; color:var(--ink); margin-bottom:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hcb-pc-rol{ font-weight:400; font-size:9.5px; color:var(--ink2); }
  .hcb-guard{ font-size:9.5px; color:var(--jade); font-weight:700; }
  .hcb-pc-row{ display:flex; align-items:center; gap:6px; margin:3px 0; }
  .hcb-pc-k{ font:700 8.5px 'Noto Serif SC',serif; color:var(--ink2); width:16px; }
  .hcb-pc-row .hcb-bar{ flex:1; height:8px; }
  .hcb-pc-v{ font-size:9.5px; color:var(--ink2); font-variant-numeric:tabular-nums; min-width:48px; text-align:right; }
  .hcb-pc-bp{ font:700 9px 'Noto Serif SC',serif; letter-spacing:.04em; color:var(--ink2); margin-top:5px; display:flex; align-items:center; gap:4px; }
  .hcb-bp{ width:9px; height:9px; border-radius:50%; background:rgba(60,42,20,.25); box-shadow:inset 0 0 0 1px var(--bronze-d); }
  .hcb-bp.on{ background:radial-gradient(circle at 35% 30%, var(--bronze-hi), var(--bronze) 70%); box-shadow:0 0 5px rgba(181,138,62,.7), inset 0 0 0 1px var(--bronze-d); }

  /* Menú de acción (abajo-derecha): pergamino desplegado con rodillos de madera */
  .hcb-menu{ position:relative; flex:0 0 auto; width:min(460px,52%); pointer-events:auto;
    background:var(--paper-face); color:var(--ink); border-radius:3px; padding:12px 14px;
    box-shadow:var(--frame); }
  .hcb-menu::before, .hcb-menu::after{ content:''; position:absolute; top:-5px; bottom:-5px; width:11px; border-radius:6px;
    background:linear-gradient(90deg,var(--wood),var(--wood2) 45%,var(--wood)); box-shadow:inset 0 0 0 1px var(--bronze-d), 0 4px 9px rgba(0,0,0,.5); }
  .hcb-menu::before{ left:-10px; } .hcb-menu::after{ right:-10px; }
  .hcb-menu.waiting{ filter:saturate(.85) brightness(.97); }
  /* Flotando junto a quien actúa (escritorio): compacto y se desliza al siguiente actor */
  .hcb-menu.floating{ width:340px; max-width:44vw; z-index:9;
    transition:left .28s cubic-bezier(.4,.9,.3,1), top .28s cubic-bezier(.4,.9,.3,1); }
  .hcb-menu.floating.waiting{ width:auto; min-width:180px; }
  .hcb-menu-who{ font:400 12px 'Noto Serif SC',serif; color:var(--ink2); margin-bottom:9px; padding-bottom:7px; border-bottom:1px solid rgba(106,74,36,.4); }
  .hcb-menu-who b{ color:var(--cinnabar-d); font-weight:700; }
  .hcb-menu-wait{ text-align:center; color:var(--ink2); padding:14px 0; font:400 13px 'Noto Serif SC',serif; } .hcb-menu-wait b{ color:var(--cinnabar-d); }
  .hcb-boost{ display:flex; align-items:center; gap:7px; margin-bottom:10px; flex-wrap:wrap; }
  .hcb-boost-lbl{ font:700 9px 'Noto Serif SC',serif; letter-spacing:.06em; text-transform:uppercase; color:var(--ink2); }
  /* Fichas de boost = monedas de bronce; activa = sello de cinabrio */
  .hcb-boost-b{ min-width:32px; padding:5px 9px; border-radius:50px; cursor:pointer; font:700 13px 'Noto Serif SC',serif;
    background:radial-gradient(circle at 35% 30%, #f0d79c, var(--bronze) 75%); border:1px solid var(--bronze-d); color:var(--wood); box-shadow:0 1px 2px rgba(0,0,0,.35); }
  .hcb-boost-b.on{ background:radial-gradient(circle at 35% 30%, var(--cinnabar-s), var(--cinnabar-d) 80%); color:#ffe9d8; border-color:var(--cinnabar-d); box-shadow:0 0 8px rgba(168,52,36,.55); }
  .hcb-boost-b.dis{ opacity:.35; cursor:not-allowed; }
  .hcb-boost-hint{ font-size:10px; color:var(--ink2); opacity:.85; }
  .hcb-acts{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; }
  /* Acción = tablilla/listón con lomo de bronce a la izquierda (cinabrio si es ataque) */
  .hcb-act{ position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:2px; cursor:pointer; text-align:left;
    padding:8px 11px 8px 14px; border-radius:3px; background:linear-gradient(158deg, rgba(255,250,230,.5), rgba(196,172,124,.42));
    border:1px solid var(--bronze-d); border-left:4px solid var(--bronze); color:var(--ink); font:700 13px 'Noto Serif SC',serif;
    box-shadow:inset 0 0 0 1px rgba(255,248,224,.35), 0 2px 4px rgba(0,0,0,.25); transition:transform .1s, background .12s, box-shadow .12s; }
  .hcb-act small{ font-weight:400; font-size:10.5px; color:var(--ink2); }
  .hcb-act-ic{ display:none; }                       /* solo icono en móvil */
  .hcb-act-tx{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .hcb-act:hover:not(.dis){ transform:translateY(-1px); background:linear-gradient(158deg, rgba(255,252,236,.7), rgba(210,186,138,.55)); box-shadow:inset 0 0 0 1px rgba(255,250,230,.5), 0 4px 9px rgba(0,0,0,.3); }
  .hcb-act.atk{ border-left-color:var(--cinnabar-s); } .hcb-act.atk:hover{ background:linear-gradient(158deg, rgba(240,210,190,.6), rgba(200,150,130,.5)); }
  .hcb-act.def{ border-left-color:var(--jade); }
  .hcb-act.dis{ opacity:.45; cursor:not-allowed; }

  /* Tooltip de acción (mantener pulsado en móvil): pergamino pequeño */
  .hcb-tip{ position:fixed; z-index:20; max-width:240px; padding:8px 12px; border-radius:4px;
    background:var(--paper-face); color:var(--ink); box-shadow:var(--frame); pointer-events:none; }
  .hcb-tip b{ display:block; font:700 13px 'Noto Serif SC',serif; margin-bottom:2px; }
  .hcb-tip small{ font:400 11.5px 'Noto Serif SC',serif; color:var(--ink2); }

  /* ── Fin de combate: gran pergamino colgado ── */
  .hcb-end{ position:fixed; inset:0; z-index:50; display:grid; place-items:center; background:rgba(8,7,5,.74); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
  .hcb-end-box{ text-align:center; padding:30px 40px; border-radius:4px; background:var(--paper-face); color:var(--ink); box-shadow:var(--frame); }
  .hcb-end-t{ font-family:'Noto Serif SC',serif; font-weight:900; font-size:32px; margin-bottom:6px; }
  .hcb-end-box.win .hcb-end-t{ color:var(--cinnabar-d); } .hcb-end-box.lose .hcb-end-t{ color:var(--ink2); }
  .hcb-end-s{ color:var(--ink2); font:400 13px 'Noto Serif SC',serif; margin-bottom:18px; }
  .hcb-end-btn{ padding:11px 22px; border-radius:3px; cursor:pointer; font:700 14px 'Noto Serif SC',serif;
    background:radial-gradient(circle at 40% 25%, var(--cinnabar-s), var(--cinnabar-d) 85%); color:#ffe9d8; border:1px solid var(--cinnabar-d); box-shadow:0 3px 10px rgba(168,52,36,.4); }

  /* ── Vertical (móvil retrato): interfaz compacta apilada, pensada para una mano ── */
  @media(max-aspect-ratio:87/100){
    .hcb-hud{ padding:24px 10px calc(10px + env(safe-area-inset-bottom)); gap:6px; }
    .hcb-log{ width:96%; font-size:11.5px; line-height:1.4; min-height:16px; }
    .hcb-hud-row{ flex-direction:column; align-items:stretch; gap:7px; }
    .hcb-menu{ width:100%; order:1; padding:9px 10px; border-radius:12px; }
    .hcb-menu-who{ margin-bottom:6px; font-size:11.5px; }
    .hcb-boost{ margin-bottom:7px; gap:5px; }
    .hcb-boost-b{ min-width:30px; padding:4px 7px; }
    /* Acciones = cuadros SOLO con icono; el detalle sale al mantener pulsado */
    .hcb-acts{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
    .hcb-act{ flex:0 0 auto; width:56px; height:56px; padding:0; border-radius:9px; border:1px solid var(--bronze-d); border-left:1px solid var(--bronze-d);
      display:grid; place-items:center; }
    .hcb-act.atk{ border-color:var(--cinnabar-s); } .hcb-act.def{ border-color:var(--jade); }
    .hcb-act-tx{ display:none; }
    .hcb-act-ic{ display:block; font:700 26px 'Noto Serif SC',serif; color:var(--ink); line-height:1; }

    /* Banda: tira compacta de 3 fichas bajo el menú */
    .hcb-party{ order:2; gap:6px; }
    .hcb-pc{ max-width:none; padding:5px 7px; border-radius:9px; }
    .hcb-pc.cur{ transform:translateY(-3px); }
    .hcb-pc-h{ font-size:10.5px; margin-bottom:3px; }
    .hcb-pc-rol,.hcb-guard{ display:none; }
    .hcb-pc-row{ margin:2px 0; gap:4px; }
    .hcb-pc-row .hcb-bar{ height:6px; }
    .hcb-pc-k{ font-size:8px; width:13px; }
    .hcb-pc-v{ font-size:9px; min-width:40px; }
    .hcb-pc-bp{ display:none; }

    /* Cabecera del enemigo y orden de turno, más contenidos arriba */
    .hcb-foehud{ width:min(300px,66vw); top:10px; left:12px; }
    .hcb-foe-top{ font-size:14px; }
    .hcb-timeline{ top:10px; right:12px; }
    .hcb-tl-chip{ width:30px; height:30px; border-radius:8px; font-size:14px; }
  }
</style>
</head>
<body>
  <div id="hcb-root"></div>
  <script src="assets/js/hac-util.js?v=1"></script>
  <script src="assets/js/hac-char.js?v=17"></script>
  <script src="assets/js/hac-combate.js?v=18"></script>
  <script>HacCombate.init(document.getElementById('hcb-root'));</script>
</body>
</html>
