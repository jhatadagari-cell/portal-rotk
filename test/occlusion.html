<!doctype html><html><head><meta charset="utf-8"><title>Test de oclusión · Portal ROTK</title>
<style>
  body{background:#14110c;color:#e6dcc0;font:14px/1.5 ui-monospace,Menlo,monospace;margin:0;padding:20px}
  h1{font:700 18px system-ui;color:#f3e6c4;margin:0 0 4px}
  .sub{color:#9a8360;font:13px system-ui;margin-bottom:16px}
  pre{white-space:pre-wrap;margin:0}
  .ok{color:#8ac06a}.bad{color:#e0715a;font-weight:700}.mut{color:#9a8360}
  .box{border:1px solid #3a2c17;border-radius:10px;padding:12px 14px;margin:10px 0;background:#1b1610}
  canvas{display:none}
</style></head><body>
<h1>Test de oclusión — orden de pintado isométrico</h1>
<div class="sub">Verifica que el orden respeta TODAS las relaciones «detrás de» (0 violaciones). Compara el orden por profundidad actual con el viejo <code>Array.sort</code>. Abrir esta página = correr el test.</div>
<div class="box"><pre id="out">corriendo…</pre></div>
<canvas id="c"></canvas>

<!-- Dependencias mínimas para que HacIso cargue y exponga _occ -->
<script src="../assets/js/hac-util.js"></script>
<script src="../assets/js/iso-sprites-meta.js"></script>
<script src="../assets/js/hac-flora.js"></script>
<script src="../assets/js/hac-iso.js"></script>
<script>
(function () {
  var log = [], failed = false;
  function line(s, cls) { log.push(cls ? '<span class="' + cls + '">' + s + '</span>' : s); document.getElementById('out').innerHTML = log.join('\n'); }
  function fail(s) { failed = true; line('✗ ' + s, 'bad'); }
  function ok(s) { line('✓ ' + s, 'ok'); }

  var occ = window.HacIso && HacIso._occ;
  if (!occ) { fail('HacIso._occ no disponible — ¿cargó hac-iso.js?'); return; }
  var before = occ.before, depthOrder = occ.depthOrder;

  // Dos huellas se SOLAPAN (comparten celdas) → su orden de pintado SÍ es visible.
  // Los pares que NO se solapan nunca producen artefacto, sea cual sea su orden.
  function overlap(A, B) { return !(A[2] <= B[0] || B[2] <= A[0] || A[3] <= B[1] || B[3] <= A[1]); }
  // Violaciones VISIBLES: pares que se solapan y cuyo pintado contradice a `before`
  // (el pintado después, j, resulta estar «detrás de» el de antes, i).
  function violations(order) {
    var boxes = order.map(function (d) { return d.box; }), n = boxes.length, v = 0, ex = null;
    for (var i = 0; i < n; i++) for (var j = i + 1; j < n; j++) {
      if (overlap(boxes[i], boxes[j]) && before(boxes[j], boxes[i])) { v++; if (!ex) ex = [i, j]; }
    }
    return { v: v, ex: ex };
  }
  // El orden VIEJO (roto): Array.sort sobre un orden parcial.
  function naiveOrder(items) {
    return items.slice().sort(function (p, q) { return before(p.box, q.box) ? -1 : (before(q.box, p.box) ? 1 : 0); });
  }
  // PRNG determinista (mulberry32) para fuzz repetible.
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  // ── 1) FUZZ: cajas de huella al azar ───────────────────────────────────────
  var SETS = 4000, r = rng(12345), topoBad = 0, naiveBad = 0, worstNaive = 0;
  for (var s = 0; s < SETS; s++) {
    var n = 4 + Math.floor(r() * 8), items = [];
    for (var k = 0; k < n; k++) {
      var x0 = Math.floor(r() * 9), y0 = Math.floor(r() * 9);
      var w = 1 + Math.floor(r() * 3), h = 1 + Math.floor(r() * 3);
      items.push({ box: [x0, y0, x0 + w, y0 + h] });
    }
    var t = violations(depthOrder(items, function (d) { return d.box; })).v;
    var na = violations(naiveOrder(items)).v;
    if (t > 0) topoBad++;
    if (na > 0) { naiveBad++; if (na > worstNaive) worstNaive = na; }
  }
  line('');
  line('── FUZZ (' + SETS + ' escenas aleatorias de huellas) ──', 'mut');
  if (topoBad === 0) ok('orden por profundidad: 0 escenas con violaciones');
  else fail('orden por profundidad: ' + topoBad + ' escenas con violaciones (¡NO debería!)');
  line('   Array.sort viejo: ' + naiveBad + ' escenas rotas (hasta ' + worstNaive + ' violaciones en una) ← por esto reaparecía el bug', naiveBad ? 'bad' : 'mut');

  // ── 2) FINCA real: horneada con edificios + murallas ────────────────────────
  line('');
  line('── FINCA real (mapa con edificios y murallas) ──', 'mut');
  try {
    var mapa = { v: 1, construcciones: [
      { pos: [4, 3], tipo: 'salon', rot: 0 }, { pos: [8, 4], tipo: 'cuartel', rot: 0 },
      { pos: [3, 8], tipo: 'muralla' }, { pos: [4, 8], tipo: 'muralla' }, { pos: [5, 8], tipo: 'porton' },
      { pos: [6, 8], tipo: 'muralla' }, { pos: [7, 8], tipo: 'muralla' }, { pos: [10, 9], tipo: 'salon', rot: 1 }
    ] };
    HacIso.draw(document.getElementById('c'), { mapa: mapa, tier: 3, color: '#c9a84c', pabellones: [] });
    var sc = document.getElementById('c')._hacScene;
    var dl = sc && sc.drawList;
    if (!dl || !dl.length) { fail('no se pudo hornear la finca (drawList vacío)'); }
    else {
      var tf = violations(depthOrder(dl, function (d) { return d.box; }));
      var nf = violations(naiveOrder(dl));
      line('   drawList: ' + dl.length + ' objetos', 'mut');
      if (tf.v === 0) ok('orden por profundidad: 0 violaciones en el orden horneado');
      else fail('orden por profundidad: ' + tf.v + ' violaciones (pares ' + JSON.stringify(tf.ex) + ')');
      line('   Array.sort viejo: ' + nf.v + ' violaciones', nf.v ? 'bad' : 'mut');
    }
  } catch (e) { fail('excepción horneando la finca: ' + (e && e.message || e)); }

  line('');
  line(failed ? 'RESULTADO: ✗ FALLÓ' : 'RESULTADO: ✓ TODO OK', failed ? 'bad' : 'ok');
  window.__testFailed = failed;
})();
</script>
</body></html>
